[project]
name = "github-connector"
version = "0.1.0"
description = "A modular and robust Github API Client Library"
authors = [
    {name = "Sallie25",email = "salchosen18@gmail.com"}
]
readme = "README.md"
packages = [{include = "github_connector"}] # Added this line manually after init

requires-python = ">=3.10"
dependencies = [
    "requests (==2.31.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
